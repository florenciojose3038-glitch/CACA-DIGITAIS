<body>
<main class="container">
  <section id="game">
    <h1>🕵️ Caça aos Golpes Digitais</h1>
    <p class="subtitle">Descubra se você reconhece os golpes digitais!</p>
    <div class="score">Pergunta <span id="current">1</span> de <span id="total">10</span> • Pontos: <span id="score">0</span></div>
    <div class="progress"><div class="progress-bar" id="progress"></div></div>
    <div class="question" id="question"></div>
    <div class="buttons">
      <button class="true" id="trueBtn">✓ VERDADE</button>
      <button class="false" id="falseBtn">✕ FALSO</button>
    </div>
    <div class="feedback" id="feedback"></div>
    <button class="next" id="nextBtn">Próxima pergunta →</button>
  </section>

  <section id="result" class="hidden">
    <h1>🕵️ Resultado da Caça!</h1>
    <p class="subtitle" id="resultText"></p>
    <button class="restart" id="restartBtn">Jogar novamente</button>
  </section>
</main>

<script>
const questions = [
  {text:"Um banco pode pedir sua senha completa por mensagem para confirmar sua conta.", answer:false},
  {text:"Links recebidos de desconhecidos podem levar a páginas falsas criadas para roubar informações.", answer:true},
  {text:"Uma promoção muito boa, enviada por um perfil desconhecido, pode ser um golpe.", answer:true},
  {text:"Se uma mensagem tiver o logotipo de uma empresa, ela é automaticamente verdadeira.", answer:false},
  {text:"Ativar a verificação em duas etapas ajuda a proteger suas contas.", answer:true},
  {text:"É seguro compartilhar códigos de confirmação recebidos por SMS com qualquer pessoa que diga ser do suporte.", answer:false},
  {text:"Golpistas podem usar mensagens urgentes para tentar fazer a pessoa agir sem pensar.", answer:true},
  {text:"Antes de clicar em um link suspeito, é melhor verificar o endereço e confirmar a informação por um canal oficial.", answer:true},
  {text:"Uma conta de rede social com muitos seguidores nunca pode ser falsa.", answer:false},
  {text:"Desconfiar de pedidos inesperados de dinheiro, senhas ou códigos é uma boa forma de evitar golpes.", answer:true}
];

let index=0, score=0, answered=false;
const $=id=>document.getElementById(id);

function loadQuestion(){
  answered=false;
  $("question").textContent=questions[index].text;
  $("current").textContent=index+1;
  $("total").textContent=questions.length;
  $("score").textContent=score;
  $("progress").style.width=((index)/questions.length*100)+"%";
  $("feedback").textContent="";
  $("nextBtn").style.display="none";
  $("trueBtn").disabled=false;
  $("falseBtn").disabled=false;
}
function answer(choice){
  if(answered)return;
  answered=true;
  const correct=choice===questions[index].answer;
  if(correct)score++;
  $("score").textContent=score;
  $("feedback").textContent=correct ? "🎉 Acertou!" : "❌ Errou!";
  $("feedback").style.color=correct ? "#35d07f" : "#ff8b98";
  $("trueBtn").disabled=true;
  $("falseBtn").disabled=true;
  $("nextBtn").style.display="block";
  $("progress").style.width=((index+1)/questions.length*100)+"%";
}
function next(){
  index++;
  if(index<questions.length) loadQuestion();
  else finish();
}
function finish(){
  $("game").classList.add("hidden");
  $("result").classList.remove("hidden");
  const percent=Math.round(score/questions.length*100);
  let msg=percent===100 ? "🏆 Perfeito! Você acertou tudo!" :
          percent>=70 ? "👏 Muito bem! Você foi muito bem." :
          percent>=50 ? "👍 Bom trabalho! Continue praticando." :
          "📚 Vale a pena estudar mais um pouco e tentar novamente.";
  $("resultText").textContent=`Você fez ${score} de ${questions.length} pontos (${percent}%). ${msg}`;
}
function restart(){
  index=0; score=0;
  $("game").classList.remove("hidden");
  $("result").classList.add("hidden");
  loadQuestion();
}
$("trueBtn").onclick=()=>answer(true);
$("falseBtn").onclick=()=>answer(false);
$("nextBtn").onclick=next;
$("restartBtn").onclick=restart;
loadQuestion();
</script>

<!-- Botão secreto: clique no título 5 vezes para abrir -->
<div id="secretTrigger" title="•••"></div>

<div id="editorModal" class="editor-modal hidden">
  <div class="editor-box">
    <button class="close-editor" id="closeEditor">×</button>
    <h2>⚙️ Editar perguntas</h2>
    <p class="editor-subtitle">Altere o texto e marque a resposta correta.</p>
    <div id="editorQuestions"></div>
    <div class="editor-actions">
      <button class="save-editor" id="saveEditor">💾 Salvar perguntas</button>
      <button class="reset-editor" id="resetEditor">↩ Restaurar padrão</button>
    </div>
  </div>
</div>

<style>
#secretTrigger{
  position:fixed;right:8px;bottom:8px;width:18px;height:18px;
  opacity:.02;cursor:pointer;z-index:20;
}
.editor-modal{
  position:fixed;inset:0;background:rgba(0,0,0,.72);
  display:flex;align-items:center;justify-content:center;
  padding:15px;z-index:100;
}
.editor-modal.hidden{display:none}
.editor-box{
  width:min(760px,100%);max-height:92vh;overflow:auto;
  background:#fff;color:#172033;border-radius:20px;padding:24px;
  text-align:left;position:relative;
}
.editor-box h2{margin-bottom:5px}
.editor-subtitle{color:#667085;margin-bottom:18px}
.close-editor{
  position:absolute;right:15px;top:12px;border:0;background:transparent;
  font-size:30px;cursor:pointer;color:#555;
}
.edit-card{
  border:1px solid #ddd;border-radius:14px;padding:14px;margin-bottom:12px;
}
.edit-card label{display:block;font-weight:bold;margin-bottom:6px}
.edit-card input[type=text]{
  width:100%;padding:11px;border:1px solid #ccc;border-radius:9px;
  font-size:15px;margin-bottom:10px;
}
.answer-row{display:flex;gap:18px;align-items:center}
.answer-row label{font-weight:normal;margin:0}
.editor-actions{display:flex;gap:10px;margin-top:16px}
.editor-actions button{
  flex:1;border:0;border-radius:10px;padding:13px;font-weight:bold;cursor:pointer;
}
.save-editor{background:#35d07f;color:#082817}
.reset-editor{background:#eee;color:#333}
</style>

<script>
(function(){
  const title = document.querySelector("h1");
  const trigger = document.getElementById("secretTrigger");
  const modal = document.getElementById("editorModal");
  const close = document.getElementById("closeEditor");
  const editor = document.getElementById("editorQuestions");
  const save = document.getElementById("saveEditor");
  const reset = document.getElementById("resetEditor");

  let clicks = 0, timer;

  // Também funciona clicando 5 vezes rapidamente no título.
  title.addEventListener("click", () => {
    clicks++;
    clearTimeout(timer);
    timer = setTimeout(() => clicks = 0, 1200);
    if(clicks >= 5){
      clicks = 0;
      openEditor();
    }
  });

  trigger.addEventListener("click", openEditor);
  close.addEventListener("click", () => modal.classList.add("hidden"));
  modal.addEventListener("click", e => {
    if(e.target === modal) modal.classList.add("hidden");
  });

  function openEditor(){
    editor.innerHTML = "";
    questions.forEach((q, i) => {
      const card = document.createElement("div");
      card.className = "edit-card";
      card.innerHTML = `
        <label>Pergunta ${i+1}</label>
        <input type="text" id="q${i}" value="">
        <div class="answer-row">
          <label><input type="radio" name="a${i}" value="true"> Verdade</label>
          <label><input type="radio" name="a${i}" value="false"> Falso</label>
        </div>
      `;
      card.querySelector(`#q${i}`).value = q.text;
      card.querySelector(`input[name="a${i}"][value="${q.answer}"]`).checked = true;
      editor.appendChild(card);
    });
    modal.classList.remove("hidden");
  }

  save.addEventListener("click", () => {
    questions.forEach((q, i) => {
      q.text = document.getElementById(`q${i}`).value.trim() || q.text;
      q.answer = document.querySelector(`input[name="a${i}"]:checked`).value === "true";
    });
    localStorage.setItem("verdadeOuFalsoQuestions", JSON.stringify(questions));
    index = 0;
    score = 0;
    loadQuestion();
    modal.classList.add("hidden");
    alert("Perguntas salvas com sucesso!");
  });

  reset.addEventListener("click", () => {
    if(confirm("Restaurar as 10 perguntas originais?")){
      localStorage.removeItem("verdadeOuFalsoQuestions");
      location.reload();
    }
  });

  const saved = localStorage.getItem("verdadeOuFalsoQuestions");
  if(saved){
    try{
      const parsed = JSON.parse(saved);
      if(Array.isArray(parsed) && parsed.length === 10){
        parsed.forEach((q,i)=>{
          questions[i].text = q.text;
          questions[i].answer = !!q.answer;
        });
      }
    }catch(e){}
  }
})();
</script>

</body>
</html>
